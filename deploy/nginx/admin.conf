# Admin 前端 Nginx 配置
# 功能：
#   1. SPA 路由 fallback（所有未匹配路径返回 index.html）
#   2. /api/ 反向代理到 backend 服务
#   3. /socket.io/ 反向代理（WebSocket 升级）
#   4. 静态资源长缓存 + Gzip 压缩

server {
    listen 80;
    server_name _;

    # 客户端上传体积限制（OSS 直传可放宽）
    client_max_body_size 50M;

    # 根目录：构建产物
    root /usr/share/nginx/html;
    index index.html;

    # ========== 安全响应头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ========== 静态资源长缓存（带 hash 的构建产物） ==========
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ========== SSE 流式接口（必须排在 /api/ 之前，见下方说明） ==========
    # 覆盖 /api/v1/ai/stream 与 /api/v1/ai/stream/history（ai.controller 的两个 @Sse）。
    # nginx 默认开启 proxy_buffering，SSE 事件会被攒在缓冲区里不下发，前端表现为
    # 「长时间空白，然后一次性蹦出全文」；proxy_read_timeout 默认 60s 还会在静默时把连接掐断。
    # 前缀比 /api/ 长，nginx 会优先匹配到这里，其余接口仍走下面的 /api/。
    location /api/v1/ai/stream {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # 关缓冲，事件即时下发
        proxy_cache off;
        proxy_read_timeout 300s;  # LLM 首字可能很慢，不能沿用 60s
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ========== 上传文件（本地存储） ==========
    # 后端 ServeStaticModule 把本地上传目录挂在 /uploads（LOCAL_STATIC_PREFIX），不经过 /api 前缀。
    # 漏了这段的话，浏览器请求 /uploads/xxx.jpg 会落到下面的 SPA fallback，
    # 拿到一个 index.html —— 表现是所有上传图片全变裂图。
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缓存时长由后端 ServeStaticModule 下发（30 天），此处不重复设置，
        # 否则响应里会出现两个 Cache-Control 头。
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ========== API 反向代理 ==========
    # /api/ → backend:3000/api/
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ========== WebSocket 反向代理 ==========
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # 24h 心跳窗口
    }

    # ========== 健康检查（nginx 自身） ==========
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ========== SPA fallback ==========
    # Vue Router 用 history 模式，所有未匹配的非 /api 路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== 禁止访问敏感文件 ==========
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }
}