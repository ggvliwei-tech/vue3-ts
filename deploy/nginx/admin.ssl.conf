# ============================================================
# Admin / App 前端 Nginx 配置 —— HTTPS 版本（生产用）
# ============================================================
# 这是一份**独立文件**，默认的 deploy/nginx/admin.conf 一个字都没动。
#
# 为什么不直接给 admin.conf 加一个 listen 443 的 server 块：
#   admin.conf 被 Dockerfile.admin:43 和 Dockerfile.app:32 同时拷进两个镜像
#   （分别落成 conf.d/admin.conf 与 conf.d/app.conf），它同时也是本地
#   `docker compose up` 能跑起来的前提。只要里面出现
#     ssl_certificate /etc/nginx/certs/fullchain.pem;
#   而挂载点没有证书，nginx 会**直接启动失败** —— 等于为了上一个还没准备好的
#   功能，把现在能用的 HTTP 路径弄坏。所以新开一份，由运维按需挂载覆盖。
#
# ---------- 启用步骤 ----------
# 1) 证书放到宿主机（deploy/certs/ 已在 .gitignore 里，私钥绝不入库）：
#      deploy/certs/fullchain.pem     证书链（叶子 + 中间证书）
#      deploy/certs/privkey.pem       私钥
# 2) docker-compose.yml 的 admin / app 两个服务各自改成：
#      ports:
#        - "80:80"
#        - "443:443"
#      volumes:
#        - ./deploy/nginx/admin.ssl.conf:/etc/nginx/conf.d/admin.conf:ro   # app 服务写 app.conf
#        - ./deploy/certs:/etc/nginx/certs:ro
#        - ./deploy/certbot-www:/var/www/certbot:ro
# 3) 改完先验证语法再重启（下面这条不依赖本机装没装 docker）：
#      docker run --rm -v "$PWD/deploy/nginx/admin.ssl.conf:/etc/nginx/conf.d/x.conf:ro" \
#        -v "$PWD/deploy/certs:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t
#
# ---------- 证书续期 ----------
# 续期成功后**必须** `docker compose restart admin app`（或 nginx -s reload）：
# nginx 只在启动时读一次证书文件，不 reload 的话进程里用的还是旧证书，
# 于是「续期明明成功了，浏览器还是报证书过期」。
#
# ---------- 若前面还有一层负载均衡 / 云 WAF ----------
# 那么 TLS 应该在那一层终止，这里的 443 就不该对公网发布：
# 把 admin / app 的端口改回 `127.0.0.1:${ADMIN_PORT:-8080}:80`（与
# mysql / redis / backend 一致），并把下面的 HTTPS 用 LB 的配置来实现。

server {
    listen 80;
    server_name _;

    # 隐藏 nginx 版本号：响应头与错误页里的 `nginx/1.27.x` 是一个**指路牌**，
    # 让扫描器可以直接对着该版本的已知漏洞来打。关掉不解决漏洞本身，
    # 但能免掉「被顺手扫到」这一层。
    server_tokens off;

    # 客户端上传体积限制（与 admin.conf 一致）
    client_max_body_size 50M;

    # ========== ACME 校验放行 ==========
    # certbot 的 http-01 校验必须能在**明文 80** 上取到文件，这一步不能跟着跳 443。
    # certbot 容器（webroot 模式）把挑战文件写进 /var/www/certbot，
    # 两个容器通过同一个 volume 共享该目录。
    #
    # 注意这里**不能**再写 add_header 之外的 server 级安全头：本 server 块内
    # 没有任何 server 级 add_header，所以不存在「全有或全无」顶掉的问题。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ========== 其余一律跳 HTTPS ==========
    # 用 $host 而不是写死域名：admin 与 app 是两个域名/两个端口，同一份配置通吃。
    #
    # 代价是 $host 取自请求头，所以带上任意 Host 访问本机 IP，它就会被跳转到
    # 那个域名（开放重定向）。影响有限（受害者得先点攻击者的链接，而那链接
    # 攻击者本来也能直接托管），但在有 OAuth 回调白名单 / 短信跳转链接之类的
    # 场景下会被拿来绕过校验。**知道域名后就把 $host 换成字面量域名**：
    #     return 301 https://admin.example.com$request_uri;
    #
    # 301 是永久重定向，浏览器会缓存 —— 确认 HTTPS 侧完全正常之后再上，
    # 否则调试期间浏览器会一直帮你跳走，想临时退回明文都难。
    location / {
        return 301 https://$host$request_uri;
    }

    # 与 admin.conf 同样的防敏感文件访问（明文侧也挡一道）
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }
}

server {
    listen 443 ssl;
    # nginx ≥1.25.1 的写法；1.27 上 `listen 443 ssl http2;` 已废弃并会打 warn
    http2 on;
    server_name _;

    server_tokens off;
    client_max_body_size 50M;

    # ========== 证书 ==========
    # 路径对应上面的 deploy/certs 挂载。fullchain 必须是「叶子 + 中间证书」的
    # 完整链：只放叶子证书的话，部分浏览器（尤其是老 Android / 微信内置）会因为
    # 拿不到中间证书而校验失败，现象是「我这台电脑好好的，别人打开就报错」。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只要 TLS 1.2/1.3。1.0/1.1 已被所有主流浏览器弃用，
    # 留着只会让 PCI/等保扫描报高危。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # 由客户端选（TLS1.3 下本就如此），让移动端拿到更快的套件
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # 会话复用：省掉每次握手的非对称运算，静态资源密集的页面收益很明显
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 关掉 session ticket：ticket 用一张长期密钥加密会话，密钥泄露等于历史会话可解。
    # 会话复用靠上面的 shared cache 已经够了。
    ssl_session_tickets off;

    # OCSP Stapling：把吊销状态查询的结果由服务端缓存好随握手一起下发，
    # 省去客户端自己发起的查询（隐私 + 首字节时间）。
    #
    # ⚠️ 默认**关闭**，因为大概率用不上：Let's Encrypt 已于 2025-05-07 起不再在
    #    签发的证书里放 OCSP 地址，并于 2025-08-06 关停了 OCSP 响应服务
    #    （改用 CRL）。对着这类证书开 stapling，nginx 只会不断打
    #    「ssl_stapling ... no OCSP responder」的 warn，实际什么都没做。
    #    若你的证书来自仍在提供 OCSP 的 CA（部分商业 CA），取消下面三行的注释：
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/fullchain.pem;

    # 根目录：构建产物
    root /usr/share/nginx/html;
    index index.html;

    # ========== 安全响应头 ==========
    # ⚠️ nginx 的 add_header 继承规则是个陷阱：只要子级 location 里出现了**任意一条**
    #    add_header，该 location 就完全不继承父级的 add_header —— 是"全有或全无"，
    #    不是逐条合并。所以下面每个自带 add_header 的 location 都必须把这份清单重抄一遍
    #    （比 admin.conf 多了 HSTS 一条，待启用时还有 CSP，别漏）。
    #    本 server 块内的 add_header 清单变更时，记得同步所有 location。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS：告诉浏览器「以后这个域名只准走 HTTPS」，此后即使访问 http:// 也会
    # 在本地直接改写成 https://，请求根本不会以明文发出去。
    #
    # 这里刻意先给 300 秒（5 分钟），**不是**最终值。原因：HSTS 一旦被浏览器记住
    # 就撤不回来 —— 证书过期/续期失败时，浏览器会拒绝一切「继续访问」的例外操作，
    # 用户被彻底挡在门外，运维只能等 max-age 过期。所以标准做法是先给一个很短的
    # 值跑通，确认证书**自动续期**也正常后，再逐步放大到 63072000（两年）。
    # 放开子域（includeSubDomains）同理，要等所有子域都上了 TLS 再加。
    add_header Strict-Transport-Security "max-age=300" always;

    # ========== CSP（默认关闭，先验证再启用） ==========
    # 开启前请在真实页面（admin 的表格/弹窗/上传、app 的图片预览、AI 对话的
    # markdown 渲染）上完整过一遍，F12 Console 里出现
    # 「Refused to load/execute ... because it violates the following
    # Content Security Policy directive」就是被拦了，按提示补对应指令。
    #
    # 已知需要保留的宽松项，别当成配错了：
    #   · style-src 'unsafe-inline' —— Element Plus / Vant 大量使用内联样式，
    #     去掉会让整个 UI 走形；
    #   · img-src 的 https: —— 图片可能来自 OSS/CDN 域名；
    #   · blob: —— Vant 图片预览与 CSV 导出的对象 URL。
    # connect-src 的 wss: 供 socket.io；生产下 /api 与 /socket.io 都由本 nginx
    # 反代，所以 'self' 成立。
    #
    # 想先观察而不拦截，把名字换成 Content-Security-Policy-Report-Only ——
    # 违规只打日志不拦截。
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ========== 静态资源长缓存（带 hash 的构建产物） ==========
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 上面的 add_header 会顶掉 server 级的安全头，这里必须重抄（见 server 块内的说明）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
        try_files $uri =404;
    }

    # ========== SSE 流式接口（必须排在 /api/ 之前，见下方说明） ==========
    # 覆盖 /api/v1/ai/stream 与 /api/v1/ai/stream/history（ai.controller 的两个 @Sse）。
    # nginx 默认开启 proxy_buffering，SSE 事件会被攒在缓冲区里不下发，前端表现为
    # 「长时间空白，然后一次性蹦出全文」；proxy_read_timeout 默认 60s 还会在静默时把连接掐断。
    # 前缀比 /api/ 长，nginx 会优先匹配到这里，其余接口仍走下面的 /api/。
    location /api/v1/ai/stream {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # 关缓冲，事件即时下发
        proxy_cache off;
        proxy_read_timeout 300s;  # LLM 首字可能很慢，不能沿用 60s
        # 自带 add_header 会顶掉 server 级安全头，四条都要重抄（见 server 块内的说明）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
    }

    # ========== 上传文件（本地存储） ==========
    # 后端 ServeStaticModule 把本地上传目录挂在 /uploads（LOCAL_STATIC_PREFIX），不经过 /api 前缀。
    # 漏了这段的话，浏览器请求 /uploads/xxx.jpg 会落到下面的 SPA fallback，
    # 拿到一个 index.html —— 表现是所有上传图片全变裂图。
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缓存时长由后端 ServeStaticModule 下发（30 天），此处不重复设置，
        # 否则响应里会出现两个 Cache-Control 头。
        # 同样地，这里一旦写了 add_header 就不再继承 server 级的那几条，
        # 而本路径是"用户可上传内容"的出入口 —— 少了 nosniff 影响最直接。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
    }

    # ========== API 反向代理 ==========
    # /api/ → backend:3000/api/
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端据此判断「请求是安全的」，进而决定 refresh token 的 Cookie 要不要带
        # Secure 属性。HTTPS 下必须透传成 https，否则 cookie 退化成明文可发，
        # 而浏览器在 https 页面上又会因为缺少 Secure 之外的策略而提前丢弃它。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ========== WebSocket 反向代理 ==========
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 与 admin.conf 保持一字不差：这里**没有**转发 X-Forwarded-For / -Proto，
        # 所以 backend 侧看到的 WS 来源 IP 统一是 nginx 容器的地址。
        # 这是既存行为，本次只做 TLS 改造、不顺带改它，避免和现有连接行为混在一起。
        proxy_read_timeout 86400s;  # 24h 心跳窗口
    }

    # ========== 健康检查（nginx 自身） ==========
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        # 这里同样会顶掉 server 级安全头，且此处是有意为之：
        # 该端点只回一行纯文本给探针，没有任何浏览器渲染面，
        # 补上 X-Frame-Options / CSP 之类纯属噪音。别当成漏配来"修"。
        add_header Content-Type text/plain;
    }

    # ========== SPA fallback ==========
    # Vue Router 用 history 模式，所有未匹配的非 /api 路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== 禁止访问敏感文件 ==========
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }
}
