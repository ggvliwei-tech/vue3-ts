# ============================================================
# Docker Compose 编排 - 一键启动整套生产环境
# ============================================================
# 包含服务：
#   - mysql      MySQL 8.0 数据库
#   - redis      Redis 7 缓存 + 会话存储
#   - backend    NestJS 后端 API
#   - admin      Vue3 Admin 前端（Nginx 托管）
#   - app        Vue3 App 移动端 H5（Nginx 托管）
#
# 使用：
#   1. 准备 nest-db.sql（项目根目录）首次启动会自动导入
#   2. 复制 .env.example 为 .env 并按需修改密码等
#   3. docker compose up -d
#   4. 访问：
#      - Admin:  http://localhost:8080
#      - App:    http://localhost:8081
#      - API:    http://localhost:3000
#      - Health: http://localhost:3000/health
# ============================================================

version: '3.8'

services:
  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: vue3-monorepo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-vue3_monorepo}
      MYSQL_USER: ${DB_USER:-vue3_user}
      MYSQL_PASSWORD: ${DB_PWD:-vue3_pass_2026}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行初始化脚本
      - ./packages/server/nest-db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: vue3-monorepo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly=yes
      - --requirepass=${REDIS_PASSWORD:-redis_pass_2026}
      - --maxmemory-policy=allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  # ==================== 后端 API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: vue3-monorepo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 应用
      NODE_ENV: production
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 数据库（指向同网络内的 mysql 容器）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-vue3_user}
      DB_PWD: ${DB_PWD:-vue3_pass_2026}
      DB_NAME: ${DB_NAME:-vue3_monorepo}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      # JWT（生产环境务必修改）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-me-access-secret-in-production-32chars-min}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please-change-me-refresh-secret-in-production-32chars-min}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      # OSS（按需配置）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # 日志持久化到宿主机
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-net

  # ==================== Admin 前端 ====================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: vue3-monorepo-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-8080}:80"
    networks:
      - app-net

  # ==================== App 移动端 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: vue3-monorepo-app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_H5_PORT:-8081}:80"
    networks:
      - app-net

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ==================== 网络 ====================
networks:
  app-net:
    driver: bridge
    name: vue3-monorepo-net