# ============================================================
# Docker Compose 编排 - 一键启动整套生产环境
# ============================================================
# 包含服务：
#   - mysql      MySQL 8.0 数据库
#   - redis      Redis 7 缓存 + 会话存储
#   - backend    NestJS 后端 API
#   - admin      Vue3 Admin 前端（Nginx 托管）
#   - app        Vue3 App 移动端 H5（Nginx 托管）
#
# 使用：
#   1. 数据库 schema 由 packages/server/nest-db.sql 提供，首次启动自动导入（无需手工建库）
#   2. 复制 .env.example 为 .env 并按需修改密码等
#   3. docker compose up -d
#   4. 访问：
#      - Admin:  http://localhost:8080
#      - App:    http://localhost:8081
#      - API:    http://localhost:3000
#      - Health: http://localhost:3000/health
# ============================================================

# 注：`version:` 顶层字段已被 Compose V2 废弃（设了只会在每次命令时打一条
# warning），故不再声明；V2 会自动识别本文件格式。

# 统一的日志轮转配置：容器 stdout 走 json-file 驱动，不设 max-size 会无限增长
# 直到写满磁盘。各服务通过 `<<: *default-logging` 引用。
# 注意必须放在 services 之外的顶层，否则会被 Compose 当成一个服务。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: vue3-monorepo-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      # ⚠️ DB_NAME 目前**不可改**：初始化脚本 packages/server/nest-db.sql 里
      #    `CREATE DATABASE ... vue3_monorepo` 与 `USE vue3_monorepo` 是硬编码的。
      #    改成别的名字，MySQL 会建出一个空库并把权限授给它，而 14 张表依旧建进
      #    vue3_monorepo —— 后端连上空库，登录直接报 Table doesn't exist。
      MYSQL_DATABASE: ${DB_NAME:-vue3_monorepo}
      MYSQL_USER: ${DB_USER:-vue3_user}
      MYSQL_PASSWORD: ${DB_PWD:-vue3_pass_2026}
      TZ: Asia/Shanghai
    ports:
      # 只绑回环地址，理由与 backend 的 3000 端口相同：MySQL 只应经 app-net 内网
      # 被 backend 访问。默认 `3306:3306` 会发布到 0.0.0.0，任何能连上宿主机的人
      # 都能用仓库里公开的默认口令（vue3_pass_2026 / root123456）直接拖库。
      # 需要从宿主机连库调试时，127.0.0.1:3306 依然可用。
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行初始化脚本
      - ./packages/server/nest-db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: vue3-monorepo-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 同 mysql：Redis 里存着全部 refresh token 与令牌版本号，
      # 发布到 0.0.0.0 + 公开默认口令 = 任何人都能读走会话或伪造一条
      # refresh:token:{userId}:{sessionId} 去换合法 access token，直接接管账号。
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly=yes
      - --requirepass=${REDIS_PASSWORD:-redis_pass_2026}
      - --maxmemory-policy=allkeys-lru
      # 上限必须显式设置：只给 maxmemory-policy 而不给 maxmemory，
      # 淘汰策略根本不会触发，Redis 会一路吃满宿主机内存直到被 OOM Killer 干掉。
      - --maxmemory=${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  # ==================== 后端 API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: vue3-monorepo-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 应用
      NODE_ENV: production
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 数据库（指向同网络内的 mysql 容器）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-vue3_user}
      DB_PWD: ${DB_PWD:-vue3_pass_2026}
      DB_NAME: ${DB_NAME:-vue3_monorepo}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      # ⚠️ 下面所有 `${VAR:-默认值}` 里的默认值都是**公开在仓库里的占位值**。
      #    照抄本文件直接 `docker compose up` 起的服务，其 JWT 签名密钥是全世界
      #    都知道的 —— 任何人都能自签一个管理员令牌，无需任何账号密码。
      #
      #    默认值为 **false**：不带 .env 直接 `docker compose up` 时，后端会在
      #    建连之前做一次配置自检，发现占位密钥就打印逐项修复指引并 exit(1)。
      #    这是刻意的 fail-closed —— 配置事故的后果（密钥公开 → 任意伪造登录态）
      #    是静默的，外观与「服务正常运行」完全一致；而一个起不来的进程，
      #    运维 5 秒内就会发现。
      #
      #    正式部署：`cp .env.example .env`，按提示填入真实密钥（生成方式见
      #    packages/server/src/config/production-env.util.ts 末尾的提示）。
      #    仅本机演示、确实想带着占位密钥跑起来，才显式设 true。
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      # JWT（生产环境务必修改）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-me-access-secret-in-production-32chars-min}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please-change-me-refresh-secret-in-production-32chars-min}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      # 短信：production 下 mock 默认关闭，走真实通道。而真实通道（阿里云 SDK）
      # 尚未接入，所以默认配置下「发送验证码」返回 503。
      # 想让忘记密码 / 短信登录先跑通：设为 true，验证码会写到 ./logs/backend，
      # 由运维从日志里取（不会下发给用户，也不回传前端）。
      # 正式上线请接入短信 SDK 并保持 false。
      SMS_MOCK: ${SMS_MOCK:-false}
      # 文件存储：留空/其他值 = 本地磁盘，oss 才走 OSS
      # 后两项**必须传**：代码里 path.resolve(cwd, undefined) 会直接抛 TypeError，
      # 缺了等价于容器起不来（此前这里没有这两个变量，后端容器会反复重启）。
      # 目录已由 Dockerfile.server 预先建好并 chown 给 nestjs 用户。
      STORAGE_TYPE: ${STORAGE_TYPE:-}
      LOCAL_UPLOAD_BASE_DIR: ${LOCAL_UPLOAD_BASE_DIR:-uploads}
      LOCAL_STATIC_PREFIX: ${LOCAL_STATIC_PREFIX:-/uploads}
      # AI 大模型（LLM_TYPE 留空 = openai；选 openai/dashscope_qwen 必须给对应 key）
      LLM_TYPE: ${LLM_TYPE:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      # 容器内的 localhost 指向容器自身，Ollama 若跑在宿主机需用 host.docker.internal
      # （该域名由下面的 extra_hosts 映射，仅 Linux 需要 —— Docker Desktop 自带）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      # OSS（按需配置）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_UPLOAD_FOLDER: ${OSS_UPLOAD_FOLDER:-uploads}
    ports:
      # 只绑回环地址：后端必须**只能**经 nginx 访问。
      # 后端用 `app.set('trust proxy', 1)` 从 X-Forwarded-For 里取真实客户端 IP
      # （那份值由 nginx 追加，客户端伪造的前缀会被丢弃）。若 3000 端口对外可达，
      # 攻击者就能直连并自己伪造整条 XFF 链 —— 登录限流、全局限流的键全部失效。
      # 写 127.0.0.1 而不是删掉整行：宿主机上 curl localhost:3000/health 仍可用。
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # 日志持久化到宿主机。
      # 注意：bind mount 会盖掉镜像里 /app/logs 的属主，若宿主机 ./logs/backend
      # 由 Docker 以 root 创建，容器内 nestjs(uid 1001) 就写不进去
      - ./logs/backend:/app/logs
      # 上传文件持久化（不挂载则容器重建后用户上传的图片全丢）。
      # 同样要求宿主机目录对 uid 1001 可写：
      #   mkdir -p ./uploads/backend && sudo chown -R 1001:1001 ./uploads/backend
      - ./uploads/backend:/app/uploads
    # host.docker.internal 在 Docker Desktop（Mac/Windows）上开箱即用，
    # 但 Linux 上不存在 —— 缺了它，选 LLM_TYPE=local_ollama 时 DNS 解析直接 ENOTFOUND。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-net

  # ==================== Admin 前端 ====================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: vue3-monorepo-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # 用 service_healthy 而不是短语法 `- backend`：短语法只等容器**创建**，
      # 而 nginx 的 `proxy_pass http://backend:3000` 在启动时就要解析主机名，
      # backend 还没就绪时 nginx 会直接 `host not found in upstream` 启动失败。
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8080}:80"
    networks:
      - app-net

  # ==================== App 移动端 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: vue3-monorepo-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_H5_PORT:-8081}:80"
    networks:
      - app-net

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ==================== 网络 ====================
networks:
  app-net:
    driver: bridge
    name: vue3-monorepo-net