# ============================================================
# Docker Compose 编排 - 一键启动整套生产环境
# ============================================================
# 包含服务：
#   - mysql      MySQL 8.0 数据库
#   - redis      Redis 7 缓存 + 会话存储
#   - backend    NestJS 后端 API
#   - admin      Vue3 Admin 前端（Nginx 托管）
#   - app        Vue3 App 移动端 H5（Nginx 托管）
#
# 使用：
#   1. 数据库 schema 由 packages/server/nest-db.sql 提供，首次启动自动导入（无需手工建库）
#   2. 复制 .env.example 为 .env 并按需修改密码等
#   3. docker compose up -d
#   4. 访问：
#      - Admin:  http://localhost:8080
#      - App:    http://localhost:8081
#      - API:    http://localhost:3000
#      - Health: http://localhost:3000/health
# ============================================================

# 注：`version:` 顶层字段已被 Compose V2 废弃（设了只会在每次命令时打一条
# warning），故不再声明；V2 会自动识别本文件格式。

# 统一的日志轮转配置：容器 stdout 走 json-file 驱动，不设 max-size 会无限增长
# 直到写满磁盘。各服务通过 `<<: *default-logging` 引用。
# 注意必须放在 services 之外的顶层，否则会被 Compose 当成一个服务。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 各服务的 mem_limit / cpus 是一份**保守的起点**，不是压测结论。
# 不加限制的话，任一容器跑满都会把宿主机拖死 —— 最容易发生的是 mysql：
# 一条没走索引的查询把 buffer pool 之外的临时表撑爆，或者 redis 被写入
# 大量 key（它自己的 --maxmemory 只限制数据部分，进程本身的开销不在此列），
# 结果是整台机器上的其他服务一起变慢，排查时很难指向真正的原因。
#
# ⚠️ mem_limit 设得比实际用量低不会"限速"，而是容器被 OOM Killer 干掉后按
#    restart: unless-stopped 反复重启。上线后请对照 `docker stats` 的实际峰值
#    调整；mysql / backend 是大头，nginx 两个前端只需要很小的余量。
#
# 用 mem_limit / cpus 而不是 deploy.resources.limits：后者是 Swarm 语法的
# 遗留兼容，`docker compose up`（Compose V2，非 swarm 模式）对这两个字段
# 是直接生效的，语义更明确。

services:

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: vue3-monorepo-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      # ⚠️ DB_NAME 目前**不可改**：初始化脚本 packages/server/nest-db.sql 里
      #    `CREATE DATABASE ... vue3_monorepo` 与 `USE vue3_monorepo` 是硬编码的。
      #    改成别的名字，MySQL 会建出一个空库并把权限授给它，而 14 张表依旧建进
      #    vue3_monorepo —— 后端连上空库，登录直接报 Table doesn't exist。
      MYSQL_DATABASE: ${DB_NAME:-vue3_monorepo}
      MYSQL_USER: ${DB_USER:-vue3_user}
      MYSQL_PASSWORD: ${DB_PWD:-vue3_pass_2026}
      TZ: Asia/Shanghai
    ports:
      # 只绑回环地址，理由与 backend 的 3000 端口相同：MySQL 只应经 app-net 内网
      # 被 backend 访问。默认 `3306:3306` 会发布到 0.0.0.0，任何能连上宿主机的人
      # 都能用仓库里公开的默认口令（vue3_pass_2026 / root123456）直接拖库。
      # 需要从宿主机连库调试时，127.0.0.1:3306 依然可用。
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行初始化脚本。
      # ⚠️ 入口脚本只在数据卷**为空**时初始化。如果首次 `up` 在初始化完成前
      #    被 Ctrl-C / 重启打断，会留下一个「有系统库、没有业务库和业务账号」的
      #    半成品卷；此后每次启动都会跳过初始化，backend 永远连不上。
      #    遇到这种情况只能重置数据卷（会清空容器内数据，确认无需保留后执行）：
      #      docker compose down
      #      docker volume rm vue3-monorepo_mysql_data
      #      docker compose up -d
      - ./packages/server/nest-db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    healthcheck:
      # ⚠️ 不要退回 `mysqladmin ping`：它只判断「服务端有响应」，鉴权失败、
      #    库不存在时同样返回 0。曾因此把一个**初始化中途被打断**的坏库判成
      #    healthy（root 空密码、无 vue3_user、无 vue3_monorepo），backend 被
      #    depends_on 放行后以 `Host '172.x.x.x' is not allowed` 反复重连。
      #
      #    这里直接用业务账号走 TCP：只有「账号存在 + 密码正确 + 目标库存在
      #    + 业务表已导入」四者同时成立才算健康，正好覆盖 backend 真实的连接路径。
      #    查 information_schema 而不是某张具体表：表名变了不必跟着改检查项，
      #    但仍能发现「库已建、nest-db.sql 还没跑完/被中断」的半初始化状态。
      #    $$ 是 compose 的转义，避免宿主机插值；变量由 mysql 镜像自身注入。
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -N -e
          'SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() LIMIT 1'
          "$$MYSQL_DATABASE" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      # 首次启动要跑 --initialize 与 nest-db.sql，给足初始化时间
      start_period: 60s
    # 上限给得最宽：InnoDB 默认 buffer pool 128M，加上排序/临时表/连接开销，
    # 1g 是「小规模够用、又不至于吃掉整台机器」的位置
    mem_limit: 1g
    cpus: 2
    networks:
      - app-net

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: vue3-monorepo-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 同 mysql：Redis 里存着全部 refresh token 与令牌版本号，
      # 发布到 0.0.0.0 + 公开默认口令 = 任何人都能读走会话或伪造一条
      # refresh:token:{userId}:{sessionId} 去换合法 access token，直接接管账号。
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # 用**字符串形式**而不是列表形式，唯一实质理由是下面密码那对引号：
      # 折叠标量最终交给 /bin/sh 拆词，写成 --requirepass "xxx" 时，含空格的
      # 密码仍是一个完整 argv；列表形式（- --requirepass=xxx）没法加引号，
      # 密码里有空格会被拆成两个参数，redis 只收到前半段而鉴权永远失败。
      # 当前密码 redis_pass_2026 无空格，两种写法实测解析结果一致，
      # 但换密码时能少踩一个坑。官方 redis 文档给的也是字符串形式。
      #
      # 上限必须显式设置：只给 maxmemory-policy 而不给 maxmemory，
      # 淘汰策略根本不会触发，Redis 会一路吃满宿主机内存直到被 OOM Killer 干掉。
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-redis_pass_2026}"
      --maxmemory-policy allkeys-lru
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      # --no-auth-warning：redis 7 的 redis-cli 用 -a 会在 stderr 打一行
      # "Using a password with '-a'..." 警告。不抑制时，部分编排器把
      # stderr 有输出视为失败，误报 unhealthy。
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      # 冷启动期不算失败：首次初始化 AOF/加载数据时 redis 可能几秒内不响应
      start_period: 20s
    # 必须比上面的 --maxmemory 高：maxmemory 只约束数据集，
    # 进程自身、复制缓冲、AOF 重写时的额外开销都在它之外。
    # 两者相等会让 Redis 在接近上限时先被内核杀掉（而不是按 LRU 淘汰 key）。
    mem_limit: 768m
    cpus: 1
    networks:
      - app-net

  # ==================== 向量库 ====================
  # 必须用 chromadb/chroma:1.x —— 配套 chromadb npm 客户端 3.5.0 的 /api/v2 协议。
  # 用 0.5.x 时响应里不带 configuration_json，客户端会在
  # `Cannot read properties of undefined (reading 'embedding_function')` 处崩。
  # 容器端口必须避开 8000：宿主机的 LODOP 打印服务占着它（PID/进程名见
  # CHROMA 故障排查笔记），同主机多服务并存时这是一种常见冲突。
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: vue3-monorepo-chroma
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ANONYMIZED_TELEMETRY_DISABLED=true
      # 持久化目录必须显式开，否则容器重建数据全丢
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    # 绑回环地址，理由同 mysql/redis/backend：服务只该经 app-net 被 backend 访问，
    # 本机演示/调试用 127.0.0.1:8001 也够；想开公网请改成 "8001:8000" 并配防火墙
    ports:
      - "127.0.0.1:${CHROMA_HTTP_PORT:-8001}:8000"
    healthcheck:
      # ⚠️ 这个镜像里**没有 curl / wget / python / python3 / nc**。
      #    chromadb/chroma:1.5.x 把整个服务用 PyInstaller 打成单个二进制
      #    /usr/local/bin/chroma，Python 解释器不随镜像分发 —— 用 wget/curl
      #    做探测会以 exit 127 (not found) 连续失败，10 次重试后误报 unhealthy
      #    （服务本身完全正常，这类"假红"最容易误导排查方向）。
      #
      #    镜像里确实存在的是完整的 Debian 用户空间，/usr/bin/bash 可用。
      #    因此用 bash 的 /dev/tcp 做探测：它是 bash 内建，不需要任何外部二进制，
      #    也不必往镜像里装包（镜像变大会影响拉取和构建耗时）。
      #    端点 /api/v2/heartbeat 与 npm 客户端 chromadb 3.5.0 走的 /api/v2 同代。
      #
      #    ⚠️ 里面的 $line 必须写成 $$line：compose 会把 $line 当成环境变量插值
      #    成空串（启动时会打 "The \"line\" variable is not set" 警告），
      #    探测逻辑随之恒为假，healthcheck 会永远 unhealthy。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000 &&
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 &&
          IFS= read -r -t 3 line <&3 &&
          [[ "$$line" == *200* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # HDF5 + sqlite + HNSW 索引常驻内存，1G 给得稍宽
    mem_limit: 1g
    cpus: 1
    networks:
      - app-net

  # ==================== 后端 API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: vue3-monorepo-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        # 用 service_started 而非 service_healthy：不卡死 backend 启动。
        # chroma 是 RAG 可选依赖 —— 健康检查还在 start_period 期间时
        # 不该让 backend 跟着卡住；连通性由 rag.service.ts 构造函数里的
        # 自检承担，连接失败只 warn 不抛错，RAG 接口才 503/500，其他接口照常服务。
        condition: service_started
    environment:
      # 应用
      NODE_ENV: production
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 数据库（指向同网络内的 mysql 容器）
      # ⚠️ 这里的端口是**容器内**端口（mysql 镜像默认 3306），
      #    不是宿主机映射端口（那是 ports 段的 ${MYSQL_PORT:-3306}）。
      #    同理下面的 REDIS_PORT。容器间走 app-net 的服务名 + 镜像默认端口，
      #    宿主端口挪到哪都不影响 —— 写错会让 backend 连库直接 ECONNREFUSED。
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-vue3_user}
      DB_PWD: ${DB_PWD:-vue3_pass_2026}
      DB_NAME: ${DB_NAME:-vue3_monorepo}
      # Redis（端口同 DB_PORT：容器内默认 6379，不是宿主映射的 ${REDIS_PORT}）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      # ⚠️ 下面所有 `${VAR:-默认值}` 里的默认值都是**公开在仓库里的占位值**。
      #    照抄本文件直接 `docker compose up` 起的服务，其 JWT 签名密钥是全世界
      #    都知道的 —— 任何人都能自签一个管理员令牌，无需任何账号密码。
      #
      #    默认值为 **false**：不带 .env 直接 `docker compose up` 时，后端会在
      #    建连之前做一次配置自检，发现占位密钥就打印逐项修复指引并 exit(1)。
      #    这是刻意的 fail-closed —— 配置事故的后果（密钥公开 → 任意伪造登录态）
      #    是静默的，外观与「服务正常运行」完全一致；而一个起不来的进程，
      #    运维 5 秒内就会发现。
      #
      #    正式部署：`cp .env.example .env`，按提示填入真实密钥（生成方式见
      #    packages/server/src/config/production-env.util.ts 末尾的提示）。
      #    仅本机演示、确实想带着占位密钥跑起来，才显式设 true。
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      # JWT（生产环境务必修改）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-me-access-secret-in-production-32chars-min}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please-change-me-refresh-secret-in-production-32chars-min}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      # 短信：production 下 mock 默认关闭，走真实通道。而真实通道（阿里云 SDK）
      # 尚未接入，所以默认配置下「发送验证码」返回 503。
      # 想让忘记密码 / 短信登录先跑通：设为 true，验证码会写到 ./logs/backend，
      # 由运维从日志里取（不会下发给用户，也不回传前端）。
      # 正式上线请接入短信 SDK 并保持 false。
      SMS_MOCK: ${SMS_MOCK:-false}
      # 文件存储：留空/其他值 = 本地磁盘，oss 才走 OSS
      # 后两项**必须传**：代码里 path.resolve(cwd, undefined) 会直接抛 TypeError，
      # 缺了等价于容器起不来（此前这里没有这两个变量，后端容器会反复重启）。
      # 目录已由 Dockerfile.server 预先建好并 chown 给 nestjs 用户。
      STORAGE_TYPE: ${STORAGE_TYPE:-}
      LOCAL_UPLOAD_BASE_DIR: ${LOCAL_UPLOAD_BASE_DIR:-uploads}
      LOCAL_STATIC_PREFIX: ${LOCAL_STATIC_PREFIX:-/uploads}
      # AI 大模型（LLM_TYPE 留空 = openai；选 openai/dashscope_qwen 必须给对应 key）
      LLM_TYPE: ${LLM_TYPE:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      # 知识库（RAG）用的 embedding 模型。不设时代码兜底 text-embedding-v3；
      # 注意不能沿用 OpenAI 的默认嵌入模型，DashScope 兼容端点不认。
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      # 容器内的 localhost 指向容器自身，Ollama 若跑在宿主机需用 host.docker.internal
      # （该域名由下面的 extra_hosts 映射，仅 Linux 需要 —— Docker Desktop 自带）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      # 向量库：compos 内走服务名解析（chroma:8000）。
      # 若改用 `pnpm start:dev` 在宿主机直接跑 backend（不在 docker 里），
      # 把这两个变量改成 CHROMA_HOST=127.0.0.1 / CHROMA_PORT=8001 —— 此时
      # 127.0.0.1 才是宿主，8001 是 docker run 给 chroma 的端口映射。
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      # OSS（按需配置）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_UPLOAD_FOLDER: ${OSS_UPLOAD_FOLDER:-uploads}
    ports:
      # 只绑回环地址：后端必须**只能**经 nginx 访问。
      # 后端用 `app.set('trust proxy', 1)` 从 X-Forwarded-For 里取真实客户端 IP
      # （那份值由 nginx 追加，客户端伪造的前缀会被丢弃）。若 3000 端口对外可达，
      # 攻击者就能直连并自己伪造整条 XFF 链 —— 登录限流、全局限流的键全部失效。
      # 写 127.0.0.1 而不是删掉整行：宿主机上 curl localhost:3000/health 仍可用。
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # 日志持久化到宿主机。
      # 注意：bind mount 会盖掉镜像里 /app/logs 的属主，若宿主机 ./logs/backend
      # 由 Docker 以 root 创建，容器内 nestjs(uid 1001) 就写不进去
      - ./logs/backend:/app/logs
      # 上传文件持久化（不挂载则容器重建后用户上传的图片全丢）。
      # 同样要求宿主机目录对 uid 1001 可写：
      #   mkdir -p ./uploads/backend && sudo chown -R 1001:1001 ./uploads/backend
      - ./uploads/backend:/app/uploads
    # host.docker.internal 在 Docker Desktop（Mac/Windows）上开箱即用，
    # 但 Linux 上不存在 —— 缺了它，选 LLM_TYPE=local_ollama 时 DNS 解析直接 ENOTFOUND。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 解析 PDF、跑 embedding、拼 prompt 都是 CPU 密集的，2 核是给这些留的；
    # 内存 1g 覆盖 Node 堆默认上限（约 512M～2G，取决于容器可见内存）+ pdf 解析时的峰值。
    # pdf 上传有 20MB 的体积上限，若将来放宽，这里要跟着放大。
    mem_limit: 1g
    cpus: 2
    networks:
      - app-net

  # ==================== Admin 前端 ====================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: vue3-monorepo-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # 用 service_healthy 而不是短语法 `- backend`：短语法只等容器**创建**，
      # 而 nginx 的 `proxy_pass http://backend:3000` 在启动时就要解析主机名，
      # backend 还没就绪时 nginx 会直接 `host not found in upstream` 启动失败。
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8080}:80"
    # nginx 托管静态资源，内存/CPU 需求都很小；这里给的是余量而非实际用量
    mem_limit: 128m
    cpus: 0.5
    networks:
      - app-net

  # ==================== App 移动端 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: vue3-monorepo-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_H5_PORT:-8081}:80"
    # 同 admin
    mem_limit: 128m
    cpus: 0.5
    networks:
      - app-net

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local

# ==================== 网络 ====================
networks:
  app-net:
    driver: bridge
    name: vue3-monorepo-net
